[workspace]
members = ["crates/rinva-core", "crates/rinva-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "BSD-2-Clause"
repository = "https://github.com/GBB-C2/rinva_engine"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
