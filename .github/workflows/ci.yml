name: Rust and native Windows

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['docs/screenshots/**', 'README.md', 'docs/QA.md', 'docs/ROADMAP.md']
  pull_request:
    paths-ignore: ['docs/screenshots/**', 'README.md', 'docs/QA.md', 'docs/ROADMAP.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rinva-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo run --locked -p rinva-desktop -- --validate examples/first-light.rinva
      - run: cargo run --locked -p rinva-desktop -- --validate examples/trust.rinva

  windows:
    name: windows-${{ matrix.abi }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: msvc
            toolchain: stable-x86_64-pc-windows-msvc
            smoke_artifact: native-smoke
            package_artifact: rinva-windows-x64
          - abi: gnu
            toolchain: stable-x86_64-pc-windows-gnu
            smoke_artifact: native-smoke-gnu
            package_artifact: rinva-windows-x64-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Record compiler and GNU linker
        shell: pwsh
        run: |
          rustc -vV
          if ('${{ matrix.abi }}' -eq 'gnu') {
            $compiler = Get-Command gcc.exe -ErrorAction Stop
            Write-Output "GNU linker: $($compiler.Source)"
            $triple = & $compiler.Source -dumpmachine
            if ($LASTEXITCODE -ne 0 -or $triple -ne 'x86_64-w64-mingw32') { throw "Unexpected GNU linker: $triple" }
          }
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release -p rinva-desktop
      - name: Bundle verified CJK fonts
        shell: pwsh
        run: ./tools/fetch-fonts.ps1
      - name: Debug startup in a custom Cargo output directory
        shell: pwsh
        run: |
          cargo run --locked -p rinva-desktop --target-dir .inkcode/cargo/2 -- --validate examples/trust.rinva
          if ($LASTEXITCODE -ne 0) { throw 'Debug executable failed to start' }
          ./tools/diagnose-startup.ps1 -Executable .inkcode/cargo/2/debug/rinva.exe -FailOnMissingImports -RejectModernDpiImports
          ./tools/diagnose-startup.ps1 -Executable target/release/rinva.exe -FailOnMissingImports -RejectModernDpiImports
          Copy-Item target/release/fonts -Destination .inkcode/cargo/2/debug/fonts -Recurse
          $process = Start-Process -FilePath .inkcode/cargo/2/debug/rinva.exe -ArgumentList '--smoke-test', 'smoke-debug-output', '--legacy-dpi' -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            Get-Content smoke-debug-output/native-trace.txt -ErrorAction SilentlyContinue
            throw 'Debug smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { Get-Content smoke-debug-output/native-error.txt -ErrorAction SilentlyContinue; throw "Debug smoke failed: $($process.ExitCode)" }
          Get-Content smoke-debug-output/native-smoke.txt
          Get-Content smoke-debug-output/player-stage.txt
          if (-not (Select-String -Path smoke-debug-output/native-trace.txt -Pattern 'DPI: monitor fallback' -Quiet)) { throw 'DPI fallback was not exercised' }
          if (Select-String -Path smoke-debug-output/native-trace.txt -Pattern 'RUNAWAY' -Quiet) { throw 'Debug message loop did not settle' }
      - name: Native smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath target/release/rinva.exe -ArgumentList '--smoke-test', 'smoke-output' -PassThru
          if (-not $process.WaitForExit(150000)) {
            $process.Kill()
            Get-Content smoke-output/native-trace.txt -ErrorAction SilentlyContinue
            throw 'Native smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { Get-Content smoke-output/native-error.txt -ErrorAction SilentlyContinue; throw "Native smoke failed: $($process.ExitCode)" }
          Get-Content smoke-output/native-smoke.txt
          Get-Content smoke-output/player-stage.txt
          if (Select-String -Path smoke-output/native-trace.txt -Pattern 'RUNAWAY' -Quiet) { throw 'Native message loop did not settle' }
      - name: Exported player startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath smoke-output/standalone/RinvaPlayer.exe -ArgumentList '--smoke-player', 'smoke-player-output' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Exported player timed out' }
          if ($process.ExitCode -ne 0) { Get-Content smoke-player-output/native-error.txt -ErrorAction SilentlyContinue; throw "Exported player failed: $($process.ExitCode)" }
          Get-Content smoke-player-output/native-player.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/Rinva -Force
          Copy-Item target/release/rinva.exe, README.md, LICENSE -Destination dist/Rinva
          Copy-Item tools/diagnose-startup.ps1 -Destination dist/Rinva
          Copy-Item examples -Destination dist/Rinva -Recurse
          Copy-Item target/release/fonts -Destination dist/Rinva -Recurse
          Copy-Item docs -Destination dist/Rinva -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.smoke_artifact }}
          path: |
            smoke-output
            smoke-debug-output
            smoke-player-output
            !smoke-output/standalone/**
            !smoke-debug-output/standalone/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_artifact }}
          path: dist/Rinva
